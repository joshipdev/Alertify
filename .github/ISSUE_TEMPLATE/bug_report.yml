name: Bug report
description: Report a reproducible problem in the app, Firebase integration, build, or firmware.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues. Never include passwords, API keys, Firebase secrets, personal data, or unredacted logs.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Flutter app
        - Firebase / Realtime Database
        - Android build or release
        - ESP32 firmware or hardware
        - Documentation or tooling
        - Not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, platform, board, and library versions. Do not include credentials.
      placeholder: Flutter/Dart, Android, Firebase, ESP32 board, firmware libraries
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets, tokens, personal information, and private database data before sharing.
    validations:
      required: false
