name: Build & Release Alertify App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

jobs:
  build-and-release:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Release Artifacts
        id: artifacts
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.2"
          fi
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/Alertify-$TAG.apk
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/Alertify-$TAG.aab

      - name: Upload APK artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Alertify-APK
          path: release-artifacts/*.apk

      - name: Upload AAB artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Alertify-AAB
          path: release-artifacts/*.aab

      - name: Create GitHub Release and Upload Assets
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: Alertify App Release ${{ steps.artifacts.outputs.release_tag }}
          body: |
            ## Alertify Home Alert System - Android Release ${{ steps.artifacts.outputs.release_tag }}

            ### Included Artifacts:
            * **APK (`Alertify-${{ steps.artifacts.outputs.release_tag }}.apk`)**: Directly installable APK for Android phones/tablets.
            * **AAB (`Alertify-${{ steps.artifacts.outputs.release_tag }}.aab`)**: Android App Bundle for Google Play Store publishing.
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
